[project]
name = "svalbard-crevasse-analysis"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["output", "input"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["*.py"]
pythonpath = ["."]
